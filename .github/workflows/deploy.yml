name: Deploy to OVHcloud

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build images + Deploy k8s
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

      # Docker login — OVHcloud Managed Private Registry (GRA)
      - name: Login to OVHcloud registry
        uses: docker/login-action@v3
        with:
          registry: registry.gra.cloud.ovh.net
          username: ${{ secrets.OVH_REGISTRY_USER }}
          password: ${{ secrets.OVH_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            registry.gra.cloud.ovh.net/erp/api:latest
            registry.gra.cloud.ovh.net/erp/api:${{ github.sha }}
          cache-from: type=registry,ref=registry.gra.cloud.ovh.net/erp/api:buildcache
          cache-to: type=registry,ref=registry.gra.cloud.ovh.net/erp/api:buildcache,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.yourdomain.fr
            NEXT_PUBLIC_WS_URL=wss://api.yourdomain.fr
          tags: |
            registry.gra.cloud.ovh.net/erp/web:latest
            registry.gra.cloud.ovh.net/erp/web:${{ github.sha }}

      # Deploy to OVHcloud Managed Kubernetes (région GRA)
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.OVH_KUBECONFIG }}" > ~/.kube/config

      - name: Run Prisma migrations
        run: |
          kubectl exec -n erp-production deploy/erp-api -- npx prisma migrate deploy
        continue-on-error: true

      - name: Deploy API
        run: |
          kubectl set image deployment/erp-api api=registry.gra.cloud.ovh.net/erp/api:${{ github.sha }} \
            -n erp-production
          kubectl rollout status deployment/erp-api -n erp-production --timeout=120s

      - name: Deploy Web
        run: |
          kubectl set image deployment/erp-web web=registry.gra.cloud.ovh.net/erp/web:${{ github.sha }} \
            -n erp-production
          kubectl rollout status deployment/erp-web -n erp-production --timeout=120s

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy failed for commit ${{ github.sha }}"
          # TODO: ajouter notification Slack/email
