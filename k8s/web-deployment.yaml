apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-web
  namespace: erp-production
  labels:
    app: erp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-web
  template:
    metadata:
      labels:
        app: erp-web
    spec:
      containers:
        - name: web
          image: registry.gra.cloud.ovh.net/erp/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.yourdomain.fr"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.yourdomain.fr"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: erp-web
  namespace: erp-production
spec:
  selector:
    app: erp-web
  ports:
    - port: 3000
      targetPort: 3000
