packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
# Correctifs de sécurité des dépendances indirectes (pnpm audit), dans la
# même version majeure que celle attendue
overrides:
  proxy-addr: ^2.0.8
  'ws@>=8': ^8.21.0
  'brace-expansion@<2': ^1.1.18
  'brace-expansion@>=2 <3': ^2.0.3
  socket.io-parser: ^4.2.7
  'nanoid@<4': ^3.3.18
  postcss: ^8.5.18
  engine.io: ^6.6.11
  browserslist: ^4.29.3
