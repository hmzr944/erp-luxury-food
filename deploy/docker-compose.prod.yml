# FLŌW sur un seul serveur : base, file d'attente, API, caisse web, HTTPS,
# sauvegardes chiffrées hors du serveur. Guide : docs/installation-production.md
#
# Toujours lancé avec le fichier de variables du serveur :
#   ./deploy/flow up -d --build
# (équivaut à docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml …)
name: flow

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  PORT: "3001"
  DATABASE_URL: postgresql://${POSTGRES_USER:-flow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante dans deploy/.env.prod}@postgres:5432/${POSTGRES_DB:-flow}
  REDIS_URL: redis://redis:6379
  FRONTEND_URL: https://${APP_DOMAIN:?APP_DOMAIN manquante dans deploy/.env.prod}
  # Un relais devant l'API (Caddy) : vraie adresse IP du client pour la limitation des requêtes et le journal
  TRUST_PROXY: "1"
  TZ: ${TZ:-Europe/Paris}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante dans deploy/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      TZ: ${TZ:-Europe/Paris}
    # Aucun port publié : la base n'est joignable que depuis les conteneurs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logs

  # Migrations Prisma, avant l'API. Si elles échouent, l'API ne démarre pas
  # (et « up » s'arrête en erreur).
  migrate:
    image: flow-api:local
    build: *api-build
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: ../apps/api/.env.production
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logs

  api:
    image: flow-api:local
    build: *api-build
    restart: unless-stopped
    env_file: ../apps/api/.env.production
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /api/health répond 200 même base coupée : on exige "status":"ok"
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *logs

  web:
    image: flow-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Adresses lues à la construction par Next.js (NEXT_PUBLIC_*)
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN manquante dans deploy/.env.prod}
        NEXT_PUBLIC_WS_URL: wss://${API_DOMAIN}
    restart: unless-stopped
    environment:
      # Le serveur Next.js autonome écoute sur HOSTNAME : toutes les interfaces
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-Europe/Paris}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquante dans deploy/.env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging: *logs

  # Sauvegarde quotidienne chiffrée hors du serveur, contrôle d'ancienneté,
  # restauration (deploy/backup/restore.sh). Voir docs/sauvegardes.md
  backup:
    image: flow-backup:local
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-flow}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-flow}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT manquante (clé publique age)}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT manquante}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET manquante}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID manquante}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY manquante}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-flow}
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
      BACKUP_CHECK_CRON: ${BACKUP_CHECK_CRON:-0 */6 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-30}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_KEEP_YEARLY: ${BACKUP_KEEP_YEARLY:-7}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      BACKUP_ALERT_EMAIL: ${BACKUP_ALERT_EMAIL:-}
      BACKUP_ALERT_FROM: ${BACKUP_ALERT_FROM:-}
      BACKUP_RESEND_API_KEY: ${BACKUP_RESEND_API_KEY:-}
    volumes:
      - backup_work:/var/lib/flow-backup
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logs

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_work:
